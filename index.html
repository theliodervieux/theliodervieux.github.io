  <!-- Applique le thème et la langue avant l'affichage pour éviter un flash -->
  <script>
    (function () {
      var d = document.documentElement, t = null, l = null;
      try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.setAttribute('data-theme', t);
      if (l === 'en' || l === 'fr') d.lang = l;
      d.classList.add('js');
    })();
  </script>
