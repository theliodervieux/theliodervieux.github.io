<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Thélio Dervieux</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    /* Page affichée par GitHub Pages pour toute adresse inconnue.
       1) Si l'adresse ressemble à une page du site (ex. /projets/labvision-qualyse), on redirige vers la bonne.
       2) Sinon, on affiche la page « valeur aberrante ». */
    (function () {
      var d = document.documentElement, t = null, l = null;
      try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.setAttribute('data-theme', t);
      d.lang = (l === 'en' || l === 'fr') ? l : ((navigator.language || 'fr').slice(0, 2) === 'en' ? 'en' : 'fr');
      d.classList.add('js');
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <div class="nav-wrap">
    <header class="nav">
      <nav class="nav__links" aria-label="Navigation principale">
        <a href="/#/" class="nav__link" data-i18n="navHome">Accueil</a>
        <a href="/#/a-propos" class="nav__link" data-i18n="navAbout">À propos</a>
        <a href="/#/projets" class="nav__link" data-i18n="navProjects">Projets</a>
        <a href="/#/bilan" class="nav__link" data-i18n="navReview">Bilan</a>
        <a href="/#/contact" class="nav__link" data-i18n="navContact">Contact</a>
      </nav>
      <div class="nav__tools">
        <button type="button" class="icon-btn icon-btn--text" id="lang-btn">EN</button>
        <button type="button" class="icon-btn icon-btn--solid" id="theme-btn" aria-label="Thème">
          <svg class="i-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="i-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
  </div>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <span>© <span id="year">2026</span> Thélio Dervieux · Niort, France</span>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script src="/js/motion.js"></script>
  <script src="/js/notfound.js"></script>
  <script>
    (function () {
      // 1) Anciennes adresses ou adresses « propres » → page correspondante du site
      var path = decodeURIComponent(location.pathname).replace(/\/+$/, '').replace(/\/index\.html$/, '');
      var routes = { '/a-propos': 'a-propos', '/apropos': 'a-propos', '/bilan': 'bilan', '/contact': 'contact', '/projets': 'projets', '/accueil': '' };
      if (routes[path] !== undefined) { location.replace('/#/' + routes[path]); return; }
      var m = path.match(/^\/projets?\/([a-z0-9-]+)$/);
      if (m && (window.PROJECTS || []).some(function (p) { return p.slug === m[1]; })) { location.replace('/#/projets/' + m[1]); return; }

      // 2) Page « valeur aberrante »
      var root = document.documentElement, UI = window.UI, M = window.Motion;
      var t = function (k) { return (UI[root.lang] && UI[root.lang][k]) || UI.fr[k]; };
      var main = document.getElementById('main');
      function render() {
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
        document.getElementById('lang-btn').textContent = root.lang === 'fr' ? 'EN' : 'FR';
        document.getElementById('lang-btn').setAttribute('aria-label', t('langSwitch'));
        document.getElementById('theme-btn').setAttribute('aria-label', root.getAttribute('data-theme') === 'dark' ? t('themeLight') : t('themeDark'));
        document.title = (root.lang === 'fr' ? 'Page introuvable' : 'Page not found') + ' — Thélio Dervieux';
        main.innerHTML = window.NotFoundView({ t: t, base: '/#/', plot: M.plotSVG() });
        main.querySelectorAll('[data-magnetic]').forEach(function (b) { M.magnetic(b); });
        M.observe(main);
      }
      render();
      document.getElementById('year').textContent = new Date().getFullYear();
      document.getElementById('lang-btn').addEventListener('click', function () {
        root.lang = root.lang === 'fr' ? 'en' : 'fr';
        try { localStorage.setItem('lang', root.lang); } catch (e) {}
        render();
      });
      var themeBtn = document.getElementById('theme-btn');
      themeBtn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        M.themeTransition(themeBtn, function () {
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          themeBtn.setAttribute('aria-label', next === 'dark' ? t('themeLight') : t('themeDark'));
        });
      });
    })();
  </script>
</body>
</html>
